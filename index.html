<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style id="css">
/* Layout: one dark patch panel on a pale equipment-grey page. Every project is a
   port on the panel with a status light; the panel is the summary and the navigation.
   Below it, projects are listed left-aligned, group name in the margin.
   Type: one family (Archivo), condensed width for names and panel print, normal for reading. */
:root{
  --bg:#E8EBE5; --ink:#17201C; --muted:#56635C; --line:#C6CEC6; --field:#F7F9F5; --danger:#B3261E;
  --accent:#2146C7; --accent-soft:#D6DEF6;
  --led-active:#1E8A4C; --led-paused:#B06F00; --led-planned:#2A5FC0; --led-idea:#7B877F; --led-done:#56635C;
  --panel:#1B2320; --panel-edge:#0D1311; --panel-ink:#DDE4DF; --panel-muted:#8E9B94; --jack:#090D0C; --jack-rim:#3A4742;
  --p-active:#4FE08A; --p-paused:#FFB534; --p-planned:#6FAEFF; --p-done:#DCE3DE;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --ink:#E4E9E5; --muted:#98A59E; --line:#2A3531; --field:#1A2320; --danger:#FF8A80;
    --accent:#93ABFF; --accent-soft:#1D2748;
    --led-active:#4FE08A; --led-paused:#FFB534; --led-planned:#6FAEFF; --led-idea:#7E8A84; --led-done:#B9C3BD;
    --panel:#1B2320; --panel-edge:#34413C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --ink:#E4E9E5; --muted:#98A59E; --line:#2A3531; --field:#1A2320; --danger:#FF8A80;
  --accent:#93ABFF; --accent-soft:#1D2748;
  --led-active:#4FE08A; --led-paused:#FFB534; --led-planned:#6FAEFF; --led-idea:#7E8A84; --led-done:#B9C3BD;
  --panel:#1B2320; --panel-edge:#34413C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-block:48px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:36px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

/* ---------- top ---------- */
.top{display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-stretch:62%;font-weight:800;font-size:clamp(3rem,11vw,6.25rem);line-height:.9;letter-spacing:-.01em;overflow-wrap:anywhere}
.lede{margin:0;max-width:60ch;font-size:1.1rem;color:var(--muted)}

/* ---------- patch panel ---------- */
.panel{background:var(--panel);border:1px solid var(--panel-edge);border-radius:6px;padding:18px 20px 16px;
  display:flex;flex-wrap:wrap;gap:20px 0;color:var(--panel-ink)}
.panel :focus-visible{outline-color:var(--p-planned)}
.bay{display:flex;flex-direction:column;gap:12px;padding-right:22px;margin-right:22px;border-right:1px solid var(--jack-rim);min-width:0}
.bay:last-child{border-right:0;padding-right:0;margin-right:0}
.bay-name{font-stretch:75%;font-weight:600;font-size:.95rem;letter-spacing:.02em;color:var(--panel-muted);text-decoration:none;width:fit-content}
.bay-name:hover{color:var(--panel-ink)}
.bay-name[aria-current="page"]{color:var(--panel-ink);box-shadow:0 2px 0 var(--p-planned)}
.ports{display:flex;flex-wrap:wrap;gap:12px 6px;min-height:28px}
.port{appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;color:var(--panel-ink);font-family:inherit;
  width:72px;display:flex;flex-direction:column;align-items:center;gap:6px}
.port .led{width:8px;height:8px;border-radius:50%}
.jack{width:38px;height:28px;border-radius:3px;background:var(--jack);border:1px solid var(--jack-rim);position:relative}
.jack::after{content:"";position:absolute;left:50%;bottom:-1px;width:14px;height:6px;transform:translateX(-50%);background:var(--jack);border:1px solid var(--jack-rim);border-bottom:0;border-radius:2px 2px 0 0}
.port:hover .jack,.port:focus-visible .jack{border-color:var(--panel-ink)}
.port-label{font-stretch:62%;font-weight:500;font-size:.8rem;line-height:1.1;color:var(--panel-muted);text-align:center;overflow-wrap:anywhere}
.port:hover .port-label{color:var(--panel-ink)}
.led.active{background:var(--p-active);box-shadow:0 0 8px var(--p-active)}
.led.paused{background:var(--p-paused);box-shadow:0 0 6px var(--p-paused)}
.led.planned{background:var(--p-planned)}
.led.done{background:var(--p-done)}
.led.idea{background:transparent;box-shadow:inset 0 0 0 1.5px var(--panel-muted)}
.led.ready{background:var(--p-active);box-shadow:0 0 6px var(--p-active)}
.led.busy{background:var(--p-active);box-shadow:0 0 10px var(--p-active)}
@media (prefers-reduced-motion:no-preference){
  .panel .led.active{animation:link 2.6s ease-in-out infinite}
  .panel .led.busy{animation:link .8s ease-in-out infinite}
  @keyframes link{0%,100%{opacity:1}50%{opacity:.45}}
}

.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:-22px 0 0;font-size:.9rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend a{margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.active{background:var(--led-active)} .dot.paused{background:var(--led-paused)}
.dot.planned{background:var(--led-planned)} .dot.done{background:var(--led-done)}
.dot.idea{box-shadow:inset 0 0 0 1.5px var(--led-idea)}

/* ---------- groups ---------- */
#view{display:flex;flex-direction:column;gap:52px}
.group{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 40px}
.group-head{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
h2{margin:0;font-stretch:62%;font-weight:800;font-size:2.1rem;line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.group-head p{margin:0;color:var(--muted);font-size:.95rem;max-width:44ch}
.entries{min-width:0;border-top:2px solid var(--ink)}
.entry{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--line);scroll-margin-top:16px;outline-offset:6px}
.entry.hit{background:var(--accent-soft)}
.id{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 14px}
.code{font-stretch:62%;font-weight:700;font-size:1.3rem;line-height:1.1;overflow-wrap:anywhere}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.92rem;color:var(--muted);white-space:nowrap}
.body{min-width:0;display:flex;flex-direction:column;gap:8px}
h3{margin:0;font-weight:600;font-size:1.15rem;line-height:1.3}
.body p{margin:0;max-width:64ch}
.tools{color:var(--muted);font-size:.93rem}
details{font-size:.95rem}
summary{cursor:pointer;color:var(--accent);font-weight:500;width:fit-content}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:64ch}
dl.spec{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
dl.spec dt{font-stretch:75%;font-weight:600;font-size:.92rem;color:var(--muted);margin-top:8px}
dl.spec dt:first-child{margin-top:0}
dl.spec dd{margin:0;max-width:64ch}
.empty{margin:0;padding:20px 0;color:var(--muted);font-size:.95rem;max-width:64ch}

footer{color:var(--muted);font-size:.88rem}

/* ---------- editing (only the owner sees this) ---------- */
.ownerbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 14px;border:1px dashed var(--muted);border-radius:6px;font-size:.93rem}
.ownerbar .say{flex:1 1 240px;min-width:0;color:var(--muted)}
.ownerbar .say.warn{color:var(--danger)}
.btn{appearance:none;font:inherit;font-size:.92rem;font-weight:500;line-height:1.2;padding:8px 14px;border-radius:5px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.small{padding:4px 10px;font-size:.85rem;border-color:var(--muted)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.tools-row{display:flex;flex-wrap:wrap;gap:6px}
.add-row{padding:16px 0}
dialog{border:1px solid var(--muted);border-radius:8px;background:var(--bg);color:var(--ink);padding:0;width:min(580px,calc(100vw - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:22px}
dialog h2{font-size:1.7rem}
.field{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:500}
.field small{font-weight:400;color:var(--muted);font-size:.85rem}
.field input,.field select,.field textarea{font:inherit;font-size:1rem;font-weight:400;padding:8px 10px;border:1px solid var(--muted);border-radius:5px;background:var(--field);color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:72px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}
.dlg-actions .push{margin-left:auto}


/* ---------- lectures (own view at #forelesninger) ---------- */
.lec-intro{display:flex;flex-direction:column;gap:12px}
.lec-intro p{margin:0;color:var(--muted);max-width:60ch}
.lec-search{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:500;max-width:420px}
.lec-search input{font:inherit;font-size:1rem;font-weight:400;padding:8px 10px;border:1px solid var(--muted);border-radius:5px;background:var(--field);color:var(--ink);width:100%}
.lec-course{scroll-margin-top:16px;outline-offset:6px}
.lec-meta{font-size:.9rem}
.lec-list{list-style:none;margin:0;padding:0}
.lec-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.lec-n{font-stretch:62%;font-weight:700;font-size:1.2rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--muted)}
.lec-t{font-weight:500;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.lec-t::after{content:"\00a0\2197";color:var(--accent)}
.lec-t:hover{color:var(--accent);text-decoration:underline}
.lec-w{font-size:.88rem;color:var(--muted);white-space:nowrap}
.lec-sub{margin:26px 0 0;padding-bottom:8px;font-stretch:75%;font-weight:600;font-size:.95rem;color:var(--muted);border-bottom:2px solid var(--ink)}
.lec-next{margin:14px 0 0;color:var(--muted);font-size:.93rem;max-width:64ch}
.lec-next b{font-weight:600;color:var(--ink)}
.lec-none{margin:0;color:var(--muted)}
.lec-jump{margin:0;font-size:.95rem}
.lec-course.hit .lec-list{background:var(--accent-soft)}

/* ---------- study calendar (owner only, live from TimeEdit) ---------- */
.cal-status{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0;font-size:.92rem;color:var(--muted)}
.cal-status.warn{color:var(--danger)}
.cal-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;font:inherit;font-size:.88rem;font-weight:500;padding:5px 12px;border-radius:999px;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal-day{margin:18px 0 0;padding-bottom:4px;font-weight:600;font-size:1rem;border-bottom:1px solid var(--line)}
.cal-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:2px 14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.cal-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.cal-time small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.cal-body{min-width:0;overflow-wrap:anywhere}
.cal-code{font-stretch:75%;font-weight:700}
.cal-meta{font-size:.88rem;color:var(--muted)}
.cal-kind{font-size:.85rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.cal-kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--led-planned)}
.k-lab .cal-kind::before{background:var(--led-active)}
.k-exam .cal-kind::before{background:var(--led-paused)}
.k-other .cal-kind::before{background:var(--led-idea)}
.cal-row.past{opacity:.5}
.cal-strip{display:flex;flex-direction:column;gap:2px;margin:-18px 0 0;padding:12px 16px;border-left:3px solid var(--led-active);background:var(--field);color:var(--ink);text-decoration:none;border-radius:0 6px 6px 0;width:fit-content;max-width:100%}
.cal-strip:hover{background:var(--accent-soft)}
.cal-strip small{color:var(--muted);font-size:.85rem}
.cal-strip span{overflow-wrap:anywhere}
@media (max-width:619px){.cal-row{grid-template-columns:72px minmax(0,1fr)}.cal-kind{display:none}}

.contact{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none;font-weight:500}
.contact a{text-decoration-thickness:1px;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;padding:0;list-style:none;font-size:.95rem;font-weight:500}
.links a{text-underline-offset:3px}

/* ---------- live agent status ---------- */
.live{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:.93rem;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--led-active)}
.live.busy{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.live.busy::before{animation:link .8s ease-in-out infinite}}
@media (min-width:620px){
  .entry{grid-template-columns:132px minmax(0,1fr)}
  .id{flex-direction:column;justify-content:flex-start;align-items:flex-start;gap:6px}
  dl.spec{grid-template-columns:96px minmax(0,1fr);gap:8px 16px}
  dl.spec dt{margin-top:2px}
}
@media (min-width:900px){
  .group{grid-template-columns:200px minmax(0,1fr)}
  .group-head{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;padding-top:14px}
}
</style>

<script id="app">
const STATUS = { active:"Pågår", paused:"Pauset", planned:"Planlagt", idea:"Idé", done:"Fullført" };
const RESERVED = ["oversikt","forelesninger","timeplan","settings","sidebar","customize","upgrade","downloads"];
const STASH = "arbeidsbenk-draft";
const LEC_ROUTE = "forelesninger";
const driveFile = id => "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/view";
const driveFolder = id => "https://drive.google.com/drive/folders/" + encodeURIComponent(id);

const state = JSON.parse(document.getElementById("state").textContent);
let draft = null;        // a working copy while the owner edits
let canEdit = false, artifact = null, dirty = false, saving = false;
let notice = "", noticeWarn = false, pending = null;

const root = document.getElementById("root");
const dlg = document.createElement("dialog");
dlg.id = "dlg";
document.body.appendChild(dlg);

const cur = () => draft || state;
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const safeUrl = u => /^(https?:|mailto:)/i.test(String(u || "").trim()) ? String(u).trim() : "";
const linkList = (list, cls) => {
  const items = (Array.isArray(list) ? list : []).map(p => {
    const href = Array.isArray(p) ? safeUrl(p[1]) : "";
    if (!href) return "";
    const ext = /^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : "";
    return `<li><a href="${esc(href)}"${ext}>${esc(p[0])}</a></li>`;
  }).join("");
  return items ? `<ul class="${cls}">${items}</ul>` : "";
};
const lines = s => String(s || "").split("\n").map(x => x.trim()).filter(Boolean);
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  if (!m) return "";
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("nb-NO", { day:"numeric", month:"long", year:"numeric" });
}
function today(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function findItem(id){
  for (const g of cur().groups) { const i = g.items.findIndex(x => x.id === id); if (i >= 0) return { g, i, it: g.items[i] }; }
  return null;
}
function groupSlug(title){
  let s = title.toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if (!s || RESERVED.includes(s) || s.startsWith("comment-")) s = "gruppe";
  let out = s, n = 2;
  while (cur().groups.some(g => g.id === out)) out = s + "-" + n++;
  return out;
}

/* ---------- live agent status: agent-status.json next to the page, written by a Claude Code hook ----------
   Only works where the page and the file share a host (GitHub Pages). Elsewhere the fetch fails quietly. */
const LIVE_FILE = "agent-status.json";
const LIVE_STALE = 3 * 3600e3;      // a "running" agent with no stop for 3 hours is treated as stopped
let live = null;
async function loadLive(){
  try {
    const r = await fetch(LIVE_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.agents && typeof j.agents === "object") { live = j; render(); }
  } catch (e) {}
}
function liveFor(id){
  const a = live && live.agents && live.agents[id];
  if (!a) return null;
  const start = a.lastStart ? new Date(a.lastStart) : null, end = a.lastEnd ? new Date(a.lastEnd) : null;
  const busy = Number(a.running) > 0 && start && Date.now() - start < LIVE_STALE;
  return { busy, start, end, runs: Number(a.runs) || 0 };
}
function liveWhen(d){
  return d.toLocaleDateString("nb-NO", { day:"numeric", month:"short", timeZone:"Europe/Oslo" }) + " kl. " +
    d.toLocaleTimeString("nb-NO", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Oslo" });
}
function liveLine(it){
  const s = liveFor(it.id);
  if (!s) return "";
  if (s.busy) return `<p class="live busy">Jobber nå, startet ${esc(liveWhen(s.start))}</p>`;
  const last = s.end || s.start;
  if (!last) return "";
  return `<p class="live">Sist brukt ${esc(liveWhen(last))}${s.runs ? " · " + s.runs + (s.runs === 1 ? " kjøring" : " kjøringer") : ""}</p>`;
}
function ledClass(it){
  const s = liveFor(it.id);
  return s ? (s.busy ? "busy" : "ready") : it.status;
}

/* ---------- lectures ---------- */
function lecCourses(){ const L = cur().lectures; return L && Array.isArray(L.courses) ? L.courses : []; }
function lecLink(it){
  const c = lecCourses().find(x => x.id === it.id);
  if (!c || !c.items.length) return "";
  return `<p class="lec-jump"><a href="#${LEC_ROUTE}" data-act="lec" data-id="${esc(c.id)}">Forelesninger: ${c.items.length} PDF-er</a></p>`;
}
function lecRow(c, x){
  const week = x.week ? "Uke " + x.week : "";
  const q = [c.code, c.title, x.n, x.title, week].join(" ").toLowerCase();

/* ---------- study calendar: only the owner sees it, read live from the TimeEdit feed in Google Calendar ---------- */
const CAL_ROUTE = "timeplan";
const CAL_SERVER = "Google Calendar";
const CAL_FALLBACK = "bp8hr721hvlqj7ils3b1aloe0qhh3ru8@import.calendar.google.com";
const CAL_TZ = "Europe/Oslo";
const CAL_WEEKS = 8;
const CAL_CACHE = { staleTime: 10 * 60e3, gcTime: 864e5 };
const CAL_KIND = { lecture:"Forelesning", lab:"Øving", exam:"Eksamen", other:"Annet" };
const CAL_DENY = ["needs_reauth","server_not_connected","selection_required","server_not_found","blocked_by_policy","not_in_manifest","approval_required"];
const CAL_OFF = ["not_granted","capability_disabled","capability_removed"];
const cal = { on:false, mcp:null, status:"idle", events:[], at:null, err:null, filter:"", input:null, unwatch:null, busy:false };

const osloDay = d => d.toLocaleDateString("sv-SE", { timeZone: CAL_TZ });
const osloTime = d => d.toLocaleTimeString("nb-NO", { hour:"2-digit", minute:"2-digit", timeZone: CAL_TZ });
function keyDate(key){ const [y, m, d] = key.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); }
function daysUntil(key){ return Math.round((keyDate(key) - keyDate(osloDay(new Date()))) / 864e5); }
function dayLabel(key){
  const n = daysUntil(key);
  const long = keyDate(key).toLocaleDateString("nb-NO", { weekday:"long", day:"numeric", month:"long", timeZone:"UTC" });
  if (n === 0) return "I dag, " + long;
  if (n === 1) return "I morgen, " + long;
  return long.charAt(0).toUpperCase() + long.slice(1);
}
const shortDate = key => keyDate(key).toLocaleDateString("nb-NO", { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
function isoWeek(key){
  const t = keyDate(key), day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil((Math.floor((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5) + 1) / 7);
}
function inDays(n){ return n === 0 ? "i dag" : n === 1 ? "i morgen" : n < 0 ? "" : "om " + n + " dager"; }

/* TimeEdit puts everything in summary and location; other students' names are lines starting with ":" and are dropped. */
function parseEvent(e){
  if (!e || e.status === "cancelled" || !e.start) return null;
  const s = e.start.dateTime || e.start.date, en = e.end && (e.end.dateTime || e.end.date);
  if (!s) return null;
  const sum = String(e.summary || "");
  const m = /Emnekode:\s*([A-Za-z0-9-]+)\.?\s*(?:Emnenavn:\s*(.+))?/.exec(sum);
  const lines = String(e.location || "").split("\n").map(x => x.trim()).filter(x => x && !x.startsWith(":"));
  let activity = "", teacher = "", room = "", milestone = "";
  for (const l of lines){
    if (/^Und\.?\s*aktivitet:/i.test(l)) activity = l.replace(/^Und\.?\s*aktivitet:\s*/i, "");
    else if (/^Underviser:/i.test(l)) teacher = l.replace(/^Underviser:\s*/i, "");
    else if (/(ut|inn)levering/i.test(l)) milestone = l.replace(/\s*eksamensperiode/i, "");
    else if (/eksamen/i.test(l) && !activity) activity = l;
    else if (!room){
      const rooms = [...l.matchAll(/([A-ZÆØÅ]{1,3}\d{2,4})\s+([^.,]+)\./g)].map(r => r[1] + " " + r[2].trim());
      room = rooms.length ? [...new Set(rooms)].join(", ") : l;
    }
  }
  const kind = /eksamen/i.test(activity) ? "exam" : /øving|lab/i.test(activity) ? "lab" : /forelesning/i.test(activity) ? "lecture" : "other";
  const start = new Date(s);
  if (isNaN(start)) return null;
  return { id: String(e.id || s), start, end: en ? new Date(en) : null, allDay: !e.start.dateTime,
    day: e.start.dateTime ? osloDay(start) : String(e.start.date),
    code: m ? m[1].toUpperCase() : "", course: m && m[2] ? m[2].trim() : (m ? "" : sum),
    activity: activity.replace(/\s+-\s+/g, ", "), teacher, room, milestone, kind };
}
function calWhat(x){
  if (x.kind === "exam") return (x.activity || "Eksamen") + (x.milestone ? ", " + x.milestone.toLowerCase() : "");
  return x.activity || CAL_KIND[x.kind];
}
function calList(){ return cal.events.filter(x => !cal.filter || x.code === cal.filter); }
function calUpcoming(){ const now = new Date(); return cal.events.filter(x => (x.end || x.start) > now); }

/* ---------- calendar: fetching ---------- */
function calRange(){
  return { start: osloDay(new Date()) + "T00:00:00", end: osloDay(new Date(Date.now() + CAL_WEEKS * 7 * 864e5)) + "T00:00:00" };
}
function calTake(res){
  const p = res && res.payload;
  const raw = p && Array.isArray(p.events) ? p.events : [];
  cal.events = raw.map(parseEvent).filter(x => x && (x.code || x.kind !== "other")).sort((a, b) => a.start - b.start);
  cal.at = res && res.cache ? res.cache.storedAt : Date.now();
  cal.status = "ok"; cal.err = null;
  render();
}
function calFail(err){
  const code = (err && err.code) || "upstream_error";
  if (CAL_OFF.includes(code)) { cal.on = false; if (cal.unwatch) cal.unwatch(); render(); return; }
  if (CAL_DENY.includes(code)) cal.events = [];
  cal.err = code; cal.status = "error";
  render();
}
function calWatch(id){
  if (cal.unwatch) cal.unwatch();
  const r = calRange();
  cal.input = { calendarId: id, startTime: r.start, endTime: r.end, orderBy: "startTime", pageSize: 250 };
  cal.unwatch = cal.mcp.watchTool(CAL_SERVER, "list_events", cal.input, ev => {
    if (ev.type === "data") calTake(ev.result); else calFail(ev.error);
  }, { cache: CAL_CACHE, refetchInterval: 30 * 60e3 });
}
async function calStart(mcp){
  cal.mcp = mcp; cal.on = true; cal.status = "loading"; cal.err = null;
  render();
  let id = CAL_FALLBACK;
  try {
    const r = await mcp.callTool(CAL_SERVER, "list_calendars", {}, { cache: { staleTime: 864e5, gcTime: 864e5 } });
    const list = (r && r.payload && r.payload.calendars) || [];
    const te = list.find(c => /^TimeEdit/i.test(String(c.summary || "")));
    if (te && te.id) id = te.id;
  } catch (e) {
    if (e && (CAL_DENY.includes(e.code) || CAL_OFF.includes(e.code))) { calFail(e); return; }
  }
  calWatch(id);
}
async function calRefresh(){
  if (!cal.mcp || cal.busy) return;
  cal.busy = true; cal.status = "loading";
  render();
  try {
    if (!cal.input) await calStart(cal.mcp);
    else calTake(await cal.mcp.callTool(CAL_SERVER, "list_events", cal.input, { cache: Object.assign({ refresh: true }, CAL_CACHE) }));
  } catch (e) { calFail(e); }
  finally { cal.busy = false; render(); }
}

/* ---------- calendar: rendering ---------- */
function calStatusHTML(){

}
function calRow(x, withDate){
  const past = (x.end || x.start) < new Date();
  const time = x.allDay ? "Hele dagen" : osloTime(x.start) + (x.end && x.kind !== "exam" ? "–" + osloTime(x.end) : "");
  const first = withDate ? `${esc(shortDate(x.day))}<small>${esc(time)}${inDays(daysUntil(x.day)) ? ", " + esc(inDays(daysUntil(x.day))) : ""}</small>` : esc(time);
  const meta = [x.course && withDate ? x.course : "", x.room, x.teacher].filter(Boolean).map(esc).join(" · ");
  return `<li class="cal-row k-${x.kind}${past ? " past" : ""}">
    <span class="cal-time">${first}</span>
    <div class="cal-body"><div><b class="cal-code">${esc(x.code)}</b> ${esc(calWhat(x))}</div>${meta ? `<div class="cal-meta">${meta}</div>` : ""}</div>
    <span class="cal-kind">${esc(CAL_KIND[x.kind])}</span></li>`;
}
function timeplanHTML(){
  const list = calList();
  const codes = [...new Set(cal.events.map(x => x.code).filter(Boolean))].sort();
  const chips = codes.length > 1 ? `<div class="cal-chips" role="group" aria-label="Vis emne">${["", ...codes].map(c =>
    `<button class="chip" type="button" data-act="cal-filter" data-id="${esc(c)}" aria-pressed="${cal.filter === c}">${c ? esc(c) : "Alle emner"}</button>`).join("")}</div>` : "";
  const now = new Date();
  const exams = list.filter(x => x.kind === "exam" && (x.end || x.start) > now);
  const examBody = exams.length ? `<ul class="lec-list">${exams.map(x => calRow(x, true)).join("")}</ul>`
    : `<p class="empty">${cal.events.length ? "Ingen eksamensdatoer de neste " + CAL_WEEKS + " ukene." : ""}</p>`;
  let days = "", lastWeek = null, lastDay = null;
  for (const x of list){
    const w = isoWeek(x.day);
    if (w !== lastWeek){ if (lastDay) days += "</ul>"; days += `<h3 class="lec-sub">Uke ${w}</h3>`; lastWeek = w; lastDay = null; }
    if (x.day !== lastDay){ if (lastDay) days += "</ul>"; days += `<h4 class="cal-day">${esc(dayLabel(x.day))}</h4><ul class="lec-list">`; lastDay = x.day; }
    days += calRow(x, false);
  }
  if (lastDay) days += "</ul>";
  if (!days) days = `<p class="empty">${cal.status === "ok" ? "Ingenting i timeplanen de neste " + CAL_WEEKS + " ukene." : ""}</p>`;
  return `<div class="lec-intro"><h2>Timeplan</h2>

      <div class="entries">${examBody}</div></section>
    <section class="group" id="p-cal-next" tabindex="-1" aria-labelledby="h-cal-next">
      <div class="group-head"><h2 id="h-cal-next">Dag for dag</h2><p>Forelesninger, øvinger og eksamensdatoer.</p></div>
      <div class="entries">${days}</div></section>`;
}
function calStripHTML(){
  const up = calUpcoming();
  if (!up.length) return "";

/* ---------- dialogs ---------- */
function field(id, label, value, opts){
  opts = opts || {};
  const hint = opts.hint ? `<small>${esc(opts.hint)}</small>` : "";
  const req = opts.required ? " required" : "";
  const max = opts.max ? ` maxlength="${opts.max}"` : "";
  const control = opts.rows
    ? `<textarea id="${id}" rows="${opts.rows}"${req}>${esc(value)}</textarea>`
    : `<input id="${id}" type="text" value="${esc(value)}"${req}${max}>`;
  return `<label class="field" for="${id}">${esc(label)}${hint}${control}</label>`;
}
function openDialog(html, onSubmit, onDelete){
  dlg.innerHTML = `<form id="dlg-form" method="dialog">${html}</form>`;
  const form = dlg.querySelector("form");
  form.addEventListener("submit", e => { e.preventDefault(); if (onSubmit() !== false) { dlg.close(); changed(); } });
  form.querySelector("[data-dlg=cancel]").addEventListener("click", () => dlg.close());
  const del = form.querySelector("[data-dlg=delete]");
  if (del) del.addEventListener("click", () => {
    if (del.dataset.armed) { onDelete(); dlg.close(); changed(); }
    else { del.dataset.armed = "1"; del.textContent = "Bekreft sletting"; }
  });
  dlg.showModal();
}
function actions(submitLabel, canDelete, deleteHint){
  return `<div class="dlg-actions">
    <button class="btn primary" type="submit" id="dlg-submit">${esc(submitLabel)}</button>
    <button class="btn" type="button" data-dlg="cancel" id="dlg-cancel">Avbryt</button>
    ${canDelete ? `<button class="btn danger push" type="button" data-dlg="delete" id="dlg-delete">Slett</button>` : (deleteHint ? `<small class="push">${esc(deleteHint)}</small>` : "")}
  </div>`;
}
function pageDialog(){
  const s = draft;
  openDialog(`<h2>Overskrift og ingress</h2>
    ${field("f-title", "Overskrift", s.title, { required:true, max:60 })}
    ${field("f-lede", "Ingress", s.lede, { rows:4, hint:"Én eller to setninger om hvem du er og hva siden viser." })}
    ${actions("Oppdater", false)}`,
    () => { s.title = val("f-title"); s.lede = val("f-lede"); });
}
function groupDialog(gid){
  const g = gid ? draft.groups.find(x => x.id === gid) : null;
  openDialog(`<h2>${g ? "Endre gruppe" : "Ny gruppe"}</h2>
    ${field("f-gtitle", "Navn", g ? g.title : "", { required:true, max:40 })}
    ${field("f-gnote", "Beskrivelse", g ? g.note : "", { rows:2 })}
    ${field("f-gempty", "Tekst nederst i gruppen (valgfritt)", g ? g.empty : "", { hint:"For eksempel hva som kommer senere." })}
    ${actions(g ? "Oppdater" : "Legg til", !!g && g.items.length === 0, g ? "Flytt eller slett prosjektene før gruppen kan slettes." : "")}`,
    () => {
      const title = val("f-gtitle");
      if (g) { g.title = title; g.note = val("f-gnote"); g.empty = val("f-gempty"); }
      else draft.groups.push({ id: groupSlug(title), title, note: val("f-gnote"), empty: val("f-gempty"), items: [] });
    },
    () => { draft.groups = draft.groups.filter(x => x.id !== gid); });
}
function itemDialog(id, gid){
  const found = id ? findItem(id) : null;
  const it = found ? found.it : { code:"", title:"", status:"planned", text:"", tools:[], more:[], spec:[] };
  const home = found ? found.g.id : gid;
  openDialog(`<h2>${found ? "Endre prosjekt" : "Nytt prosjekt"}</h2>
    <div class="pair">
      ${field("f-code", "Kode", it.code, { required:true, max:12, hint:"Kort navn som står under porten i panelet." })}
      <label class="field" for="f-status">Status<small>Styrer fargen på lyset.</small><select id="f-status">${Object.keys(STATUS).map(k => `<option value="${k}"${k === it.status ? " selected" : ""}>${STATUS[k]}</option>`).join("")}</select></label>
    </div>
    ${field("f-ititle", "Tittel", it.title, { required:true, max:90 })}
    <label class="field" for="f-group">Gruppe<select id="f-group">${draft.groups.map(g => `<option value="${esc(g.id)}"${g.id === home ? " selected" : ""}>${esc(g.title)}</option>`).join("")}</select></label>
    ${field("f-text", "Beskrivelse", it.text, { rows:4 })}
    ${field("f-tools", "Verktøy og tema", (it.tools || []).join(", "), { hint:"Skill med komma." })}
    ${field("f-more", "Hva jeg har gjort", (it.more || []).join("\n"), { rows:4, hint:"Ett punkt per linje. Vises bak en utvidbar lenke." })}
    ${field("f-spec", "Faktalinjer (valgfritt)", (it.spec || []).map(p => p[0] + ": " + p[1]).join("\n"), { rows:4, hint:"Én per linje, skrevet som «Etikett: tekst». Passer for agenter: Formål, Starter, Verktøy, Venter på." })}
    ${actions(found ? "Oppdater" : "Legg til", !!found)}`,
    () => {
      it.code = val("f-code"); it.title = val("f-ititle"); it.status = val("f-status"); it.text = val("f-text");
      it.tools = val("f-tools").split(",").map(x => x.trim()).filter(Boolean);
      it.more = lines(document.getElementById("f-more").value);
      it.spec = lines(document.getElementById("f-spec").value).map(l => {
        const i = l.indexOf(":");
        return i > 0 ? [l.slice(0, i).trim(), l.slice(i + 1).trim()] : ["Merk", l];
      });
      const target = draft.groups.find(g => g.id === val("f-group")) || draft.groups[0];
      if (!found) { it.id = "e" + Math.random().toString(36).slice(2, 9); target.items.push(it); }
      else if (target !== found.g) { found.g.items.splice(found.i, 1); target.items.push(it); }
      pending = it.id;
    },
    () => { found.g.items.splice(found.i, 1); });
}
function move(arr, i, d){
  const j = i + d;
  if (i < 0 || j < 0 || j >= arr.length) return false;
  const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  return true;
}

/* ---------- saving: the page republishes itself with the new content ---------- */
function buildDocument(s){
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  if (!css || !app) return null;
  const json = JSON.stringify(s).replace(/</g, "\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n'
    + '<title>' + esc(s.title) + '</title>\n'
    + '<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">\n'
    + '<style id="css">' + css + '</style>\n'
    + '<div id="root"></div>\n'
    + '<script type="application/json" id="state">' + json + '<\/script>\n'
    + '<script id="app">' + app + '<\/script>\n'
    + '</body></html>';
}
async function save(){
  if (!draft || !dirty || saving) return;
  const next = clone(draft);
  next.updated = today();
  const html = buildDocument(next);
  if (!html) { notice = "Siden klarte ikke å bygge en ny versjon av seg selv. Ingenting ble publisert."; noticeWarn = true; render(); return; }
  try { sessionStorage.setItem(STASH, JSON.stringify(draft)); } catch (e) {}
  saving = true; notice = "Publiserer endringene."; noticeWarn = false; render();
  try {
    await artifact.publish(html);
    notice = "Publisert. Siden lastes på nytt.";
  } catch (e) {
    const code = e && e.code;
    saving = false; noticeWarn = true;
    if (code === "conflict") notice = "En nyere versjon ble publisert mens du redigerte. Siden lastes på nytt, og endringene dine hentes fram igjen.";
    else if (code === "rate_limited") notice = "For mange publiseringer på kort tid. Vent litt og prøv igjen.";
    else if (code === "too_large") notice = "Siden er blitt for stor til å publiseres. Kort ned noe tekst og prøv igjen.";
    else if (["not_writer","not_granted","not_declared","capability_disabled","capability_removed","consent_required"].includes(code))
      notice = "Denne visningen kan ikke publisere. Åpne siden i claude.ai som eier og prøv igjen.";
    else notice = "Publiseringen feilet. Prøv igjen om litt.";
  }
  render();
}

/* ---------- events ---------- */
root.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "port") {
    const route = (location.hash || "").slice(1);
    const filtered = cur().groups.some(g => g.id === route);
    if (filtered && route !== el.dataset.group) { pending = id; location.hash = "#" + el.dataset.group; }
    else goTo(id);
    return;
  }
  if (act === "cal") {
    e.preventDefault();
    if ((location.hash || "").slice(1) !== CAL_ROUTE) { pending = id; location.hash = "#" + CAL_ROUTE; }
    else goTo(id);
    return;
  }
  if (act === "cal-filter") { cal.filter = id || ""; render(); return; }
  if (act === "cal-refresh") { calRefresh(); return; }
  if (act === "lec") {
    e.preventDefault();
    const target = id ? "lec-" + id : null;
    if ((location.hash || "").slice(1) !== LEC_ROUTE) { pending = target; location.hash = "#" + LEC_ROUTE; }
    else if (target) goTo(target);
    return;
  }
  if (!canEdit) return;
  if (act === "edit-on") { draft = clone(state); dirty = false; notice = ""; noticeWarn = false; render(); return; }
  if (!draft) return;
  if (act === "discard") { draft = null; dirty = false; notice = ""; noticeWarn = false; try { sessionStorage.removeItem(STASH); } catch (err) {} render(); }
  else if (act === "save") save();
  else if (act === "page") pageDialog();
  else if (act === "group-new") groupDialog(null);
  else if (act === "group-edit") groupDialog(id);
  else if (act === "group-up" || act === "group-down") {
    if (move(draft.groups, draft.groups.findIndex(g => g.id === id), act === "group-up" ? -1 : 1)) changed();
  }
  else if (act === "item-new") itemDialog(null, id);
  else if (act === "item-edit") itemDialog(id, null);
  else if (act === "item-up" || act === "item-down") {
    const f = findItem(id);
    if (f && move(f.g.items, f.i, act === "item-up" ? -1 : 1)) changed();
  }
});
root.addEventListener("input", e => { if (e.target.id === "lec-q") lecFilter(e.target.value); });
window.addEventListener("hashchange", render);
render();
loadLive();
setInterval(() => { if (document.visibilityState === "visible") loadLive(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") loadLive(); });

/* The owner's controls light up once claude.ai has said who is viewing. */
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [user, art] = await Promise.all([window.claude.use("user"), window.claude.use("artifact")]);
  if (!user || !art || !(await user.canEdit())) return;
  artifact = art; canEdit = true;
  try {
    const raw = sessionStorage.getItem(STASH);
    if (raw) {
      const kept = JSON.parse(raw);
      const same = JSON.stringify(Object.assign({}, kept, { updated: "" })) === JSON.stringify(Object.assign({}, state, { updated: "" }));
      if (same) sessionStorage.removeItem(STASH);
      else if (kept && Array.isArray(kept.groups)) { draft = kept; dirty = true; notice = "Endringene dine ble ikke publisert sist. De er hentet fram igjen."; noticeWarn = true; }
    }
  } catch (e) {}
  render();
  /* Calendar: only for the owner, and only when the page has been allowed to use the Google Calendar connector. */
  const mcp = await window.claude.use("mcp");
  if (mcp) calStart(mcp);
})();
</script>
